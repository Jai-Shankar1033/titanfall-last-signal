if(S=='end'){sh();let l=['The signal was a distress call.','Eos-9 begged for help for years.','Rook silenced the Architect.','The colony sleeps. The war is over.','','TITANFALL: LAST SIGNAL','Original code, art and audio.','Thank you for playing.'];let y=H-tm*14;l.forEach((s,i)=>tx(s,W/2,y+i*16,i>4?'#fc4':'#cde','center',9));if(tm>14)tx('ENTER: title',W/2,H-6,'#789','center')}}
// ---- main loop ----
function upd(dt){tm+=dt;music(dt);if(S=='play'&&hs>0){hs-=dt;return}
if(S=='sub'&&pr.Escape&&!cap){S='title';mn(TI())}else if(S=='title'||S=='sel'||S=='set'||S=='sub')menuUpd();else if(S=='ctl'){if(pr.Enter||tap)S='title'}else if(S=='cred'){if(pr.Enter||pr.Escape||tap){S='title';mn(TI())}}
else if(S=='brief'){if(pr.Enter||pr.Space||tap){S='play'}}
else if(S=='play')play(dt);else if(S=='pause'){if(pr.Escape)S='play';else menuUpd()}
else if(S=='dead'){if(pr.Enter||pr.KeyR||tap)respawn()}
else if(S=='res'){if(pr.KeyR||(tap&&tap.x<W/4))brief(G.n);else if(pr.Enter||tap){if(G.n<3)brief(G.n+1);else{S='end';tm=0}}}
else if(S=='end'){if(tm>14&&(pr.Enter||tap)){S='title';mn(TI())}}}
mn(TI());let last=0;
function loop(ts){let dt=Math.min(.05,(ts-last)/1000||0);last=ts;gp();upd(dt);draw();for(let k in pr)delete pr[k];tap=null;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
